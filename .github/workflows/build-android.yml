name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs
        working-directory: ./android
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APK for easy installation
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Nosotros-v1.0.0.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nosotros-APK
          path: Nosotros-v1.0.0.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nosotros Android APK (Build #${{ github.run_number }})"
          body: "Instalador Android (.apk) para Nosotros — Agenda Minimalista para Parejas (`https://citas.serviciosinformaticos.cloud`)."
          files: Nosotros-v1.0.0.apk
          prerelease: false
